<text x="510" y="1036" fill="#c3cad2" font-size="12">(right-angle pins)</text>
<text x="780" y="906" fill="#fff" font-size="17" font-weight="700">Connections</text>
<rect x="780" y="930" width="22" height="8" rx="4" fill="#ff5a5a"/>
<text x="810" y="940" fill="#d7e3ee" font-size="15"><tspan font-weight="700">3v3</tspan> jumper → 3V3 (3rd pin of the row)</text>
<rect x="780" y="956" width="22" height="8" rx="4" fill="#c77dff"/>
<text x="810" y="966" fill="#d7e3ee" font-size="15"><tspan font-weight="700">CS</tspan> straight into GPIO 42</text>
<rect x="780" y="982" width="22" height="8" rx="4" fill="#4cd964"/>
<text x="810" y="992" fill="#d7e3ee" font-size="15"><tspan font-weight="700">MOSI</tspan> straight into GPIO 41</text>
<rect x="780" y="1008" width="22" height="8" rx="4" fill="#3aa0ff"/>
<text x="810" y="1018" fill="#d7e3ee" font-size="15"><tspan font-weight="700">CLK</tspan> straight into GPIO 40</text>
<rect x="780" y="1034" width="22" height="8" rx="4" fill="#ffa53a"/>
<text x="810" y="1044" fill="#d7e3ee" font-size="15"><tspan font-weight="700">MISO</tspan> straight into GPIO 39</text>
<rect x="780" y="1060" width="22" height="8" rx="4" fill="#9aa4ae"/>
<text x="810" y="1070" fill="#d7e3ee" font-size="15"><tspan font-weight="700">GND</tspan> jumper → GND (1st pin of the row)</text>
<text x="40" y="1112" fill="#7f93a8" font-size="14">Bend the module's 3v3 and GND pins up (or clip them) so they don't touch GPIO 45 and 38. Then add the two jumpers.</text>
<text x="40" y="1132" fill="#7f93a8" font-size="14">Go by the pin names printed on the Heltec board. Leave the V4 GNSS kit unplugged, because it also uses GPIO 39–42.</text>
