<text x="40" y="818" fill="#7f93a8" font-size="14">Module pins in silkscreen order: 3v3 · CS · MOSI · CLK · MISO · GND (square pad = 3v3). CLK is the SPI clock (SCK).</text>
<text x="40" y="838" fill="#7f93a8" font-size="14">Header pin names are printed on the Heltec board. Match by name, not position.</text>
<text x="40" y="858" fill="#7f93a8" font-size="14">V4 firmware v2.0.1+ (CS 42, MISO 39). The module can also plug straight in: see the inline mounting diagram. Leave the GNSS kit unplugged.</text>
